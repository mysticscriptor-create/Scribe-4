name: Build Scribe APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # ── Stable debug keystore ───────────────────────────────────────────────
      - name: Restore debug keystore from cache
        id: ks-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: scribe-debug-keystore-v1

      - name: Generate debug keystore (first build only)
        if: steps.ks-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkeypair \
            -alias androiddebugkey \
            -keypass android \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000
          echo "New debug keystore created and cached."

      # ── Build ───────────────────────────────────────────────────────────────
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Push / PR: debug build — no R8, no ProGuard, fastest possible compile.
      # Manual trigger: release build with full R8 for a distributable APK.
      - name: Build debug APK (push / PR)
        if: github.event_name != 'workflow_dispatch'
        run: ./gradlew app:assembleDebug --no-daemon --parallel --build-cache

      - name: Upload debug APK
        if: github.event_name != 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: scribe-debug-apk
          path: app/build/outputs/apk/debug/app-debug*.apk
          retention-days: 7

      - name: Build release APK (manual trigger only)
        if: github.event_name == 'workflow_dispatch'
        run: ./gradlew app:assembleRelease --no-daemon --parallel --build-cache

      - name: Upload release APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: scribe-release-apk
          path: app/build/outputs/apk/release/app-release*.apk
          retention-days: 30

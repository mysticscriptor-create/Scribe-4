// Compose Stability Configuration — Scribe
// Processed by the Compose compiler Gradle plugin at build time.
// Entries here are promises to the compiler: these types will not mutate
// in ways Compose cannot observe. Honour the contract or risk silent UI bugs.
//
// Reference: https://developer.android.com/develop/ui/compose/performance/stability/fix
// Updated: August 2026

// Kotlin stdlib collections
// List, Set, Map are inferred as unstable by the compiler because their
// contents COULD change. In Scribe every list emitted by a StateFlow is a
// freshly-built value (Room emits a new list on every DB change; sortedBy /
// filter / associate all return new lists). We never mutate a list in-place
// after it leaves the ViewModel, so treating them as stable is safe.
// This is the primary fix for List<Book>/List<Note>/List<Folder> instability.
kotlin.collections.List
kotlin.collections.Map
kotlin.collections.Set

// Scribe data layer
// All Room entity and model data classes in this package have only val fields
// of primitive/String types. The compiler infers them as stable already (same
// module, all-val), but explicit inclusion here acts as a compile-time safety
// net: if a var field is ever accidentally added, a stability audit will flag
// it immediately rather than silently degrading recomposition performance.
com.primaloptima.scribe.data.Note
com.primaloptima.scribe.data.Book
com.primaloptima.scribe.data.Folder
com.primaloptima.scribe.data.WorldEntry
com.primaloptima.scribe.data.WritingLog
